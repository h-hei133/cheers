name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript packages
        run: npm run build:ts

      - name: Run Focused & Unit Tests
        run: npm run test:ts

      - name: Validate NormProof Architecture
        run: |
          npx --package .normproof/normproof-*.tgz normproof judge
