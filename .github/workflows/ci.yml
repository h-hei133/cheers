name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    # Playwright 1.60 supports Ubuntu 24.04; ubuntu-latest can advance beyond it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The lowest version the package claims to support, so `engines` is checked
      # rather than asserted. A run on a newer Node proves the code works on the
      # developer's machine, which is not the promise being made: the previous pin
      # was Node 20 while the code called `Promise.withResolvers`, and CI was red on
      # every commit for it without anyone noticing, because local runs were newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These gates need no compiled output, so they run before the build: a
      # dependency cycle should fail the run in seconds, not after 187s of
      # tests. See .wiki/refactor/plan.md section 9.27 for the measurements.
      - name: Check for dependency cycles
        run: npm run verify:import-cycles

      - name: Check config fields have consumers
        run: npm run check:config-consumers

      - name: Check declared hooks dispatch and tools are registered
        run: npm run check:declarations

      # Runs beside the step that pins the Node version, because it is the other
      # half of that promise: the pin proves the tree works on the floor only if
      # something says which APIs are above it. Three modules called
      # `Promise.withResolvers` (Node 22) while this job ran Node 20.3, and the
      # run was red on every push from before this gate existed.
      - name: Check nothing needs a newer Node than the declared floor
        run: npm run check:node-floor

      - name: Check JavaScript and TypeScript correctness
        run: npm run check:lint

      # The gate's own test, so a gate that stops detecting what it was written
      # for fails here rather than passing quietly. Covers every scripts/*.test.mjs.
      - name: Check the gates still detect
        run: npm run test:scripts

      - name: Check for docs and rules drift
        run: npm run verify:docs-drift:strict

      - name: Build TypeScript packages
        run: npm run build:ts

      - name: Install native execution test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep bubblewrap ffmpeg poppler-utils util-linux
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /bin/true

      - name: Install Chromium test dependency
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Run Focused & Unit Tests
        run: npm run test:ts

  normproof:
    name: Validate NormProof Architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check pinned package conformance
        run: node --test --test-concurrency=1 scripts/normproof.test.mjs scripts/normproof-conformance.test.mjs

      - name: Install and run the pinned archive
        run: |
          npm install --prefix "$RUNNER_TEMP/normproof" --no-audit --no-fund .normproof/normproof-0.1.0.tgz
          npm ls --prefix "$RUNNER_TEMP/normproof" --depth=1 typescript
          "$RUNNER_TEMP/normproof/node_modules/.bin/normproof" judge
