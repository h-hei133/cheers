name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lowest version the package claims to support, so `engines` is checked
      # rather than asserted. A run on a newer Node proves the code works on the
      # developer's machine, which is not the promise being made: the previous pin
      # was Node 20 while the code called `Promise.withResolvers`, and CI was red on
      # every commit for it without anyone noticing, because local runs were newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gates below exit non-zero on a violation, unlike the NormProof judge
      # step further down, which runs in shadow mode and never fails the build.
      # None needs the compiled output, so they run before the build: a
      # dependency cycle should fail the run in seconds, not after 187s of
      # tests. See .wiki/refactor/plan.md section 9.27 for the measurements.
      - name: Check for dependency cycles
        run: npm run verify:import-cycles

      - name: Check config fields have consumers
        run: npm run check:config-consumers

      - name: Check declared hooks dispatch and tools are registered
        run: npm run check:declarations

      # Runs beside the step that pins the Node version, because it is the other
      # half of that promise: the pin proves the tree works on the floor only if
      # something says which APIs are above it. Three modules called
      # `Promise.withResolvers` (Node 22) while this job ran Node 20.3, and the
      # run was red on every push from before this gate existed.
      - name: Check nothing needs a newer Node than the declared floor
        run: npm run check:node-floor

      # The gate's own test, so a gate that stops detecting what it was written
      # for fails here rather than passing quietly. Covers every scripts/*.test.mjs.
      - name: Check the gates still detect
        run: npm run test:scripts

      - name: Check for docs and rules drift
        run: npm run verify:docs-drift:strict

      - name: Build TypeScript packages
        run: npm run build:ts

      # The parity suite drives the Rust daemon over its real binary, and without
      # this step those tests cannot pass on a fresh checkout: they time out
      # waiting for a daemon that was never built. They pass locally because the
      # binary is already there, which is exactly the kind of gap a local run
      # cannot show.
      #
      # Both profiles, because the two are not interchangeable here. `build:rust`
      # produces the release binary the product ships, while the tests start the
      # daemon with `cargo run`, which uses the debug profile — warming only the
      # release build left the tests compiling from scratch inside their own
      # readiness window.
      - name: Build the Rust daemon
        run: |
          npm run build:rust
          cargo build --manifest-path packages/rust-core/Cargo.toml --bin daemon

      - name: Run Focused & Unit Tests
        run: npm run test:ts

      - name: Validate NormProof Architecture
        run: |
          npx --package .normproof/normproof-*.tgz normproof judge
