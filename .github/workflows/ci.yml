name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The two gates below exit non-zero on a violation, unlike the NormProof
      # judge step further down, which runs in shadow mode and never fails the
      # build. Neither needs the compiled output, so they run before the build:
      # a dependency cycle should fail the run in seconds, not after 187s of
      # tests. See .wiki/refactor/plan.md section 9.27 for the measurements.
      - name: Check for dependency cycles
        run: npm run verify:import-cycles

      - name: Check for docs and rules drift
        run: npm run verify:docs-drift:strict

      - name: Build TypeScript packages
        run: npm run build:ts

      - name: Run Focused & Unit Tests
        run: npm run test:ts

      - name: Validate NormProof Architecture
        run: |
          npx --package .normproof/normproof-*.tgz normproof judge
