name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: cheers-linux-x64
            platform: linux-x64
          - os: macos-15
            asset: cheers-darwin-arm64
            platform: darwin-arm64
          - os: macos-15-intel
            asset: cheers-darwin-x64
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20.3.0'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          SHELL_TAG="v$(node -p "require('./packages/ts-shell/package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_TAG" ] || [ "$RELEASE_TAG" != "$SHELL_TAG" ]; then
            echo "Release tag must match both package versions ($PACKAGE_TAG and $SHELL_TAG)."
            exit 1
          fi
          if [ "$(node -p 'process.platform + "-" + process.arch')" != "$RELEASE_PLATFORM" ]; then
            echo "Runner does not match release platform $RELEASE_PLATFORM."
            exit 1
          fi

      - name: Install and build
        run: npm ci && npm run build && npm run build:exe -- --outfile "dist/bin/${{ matrix.asset }}"

      - name: Verify executable
        env:
          ASSET: ${{ matrix.asset }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          DIST="dist/bin/$ASSET"
          test "$("$DIST" --version)" = "${RELEASE_TAG#v}"
          "$DIST" --help >/dev/null
          (cd dist/bin && shasum -a 256 "$ASSET" > "$ASSET.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/bin/${{ matrix.asset }}
            dist/bin/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: cheers-*
          merge-multiple: true

      - name: Verify assets
        run: |
          cd dist/release
          for asset in cheers-linux-x64 cheers-darwin-arm64 cheers-darwin-x64; do
            test -s "$asset"
            test -s "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/cheers-* --verify-tag --generate-notes
