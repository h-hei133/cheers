name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Require successful main CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            runs="$(gh run list --workflow .github/workflows/ci.yml --branch main --commit "$GITHUB_SHA" \
              --json databaseId,headSha,status,conclusion,event --limit 100)"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .event == "push")] | sort_by(.databaseId) | last | .databaseId // empty' <<< "$runs")"
            if [[ -n "$run_id" ]]; then
              run="$(jq -c --argjson id "$run_id" '.[] | select(.databaseId == $id)' <<< "$runs")"
              status="$(jq -r '.status' <<< "$run")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "The main CI run for this release commit concluded $conclusion."
                  exit 1
                fi
                jobs="$(gh run view "$run_id" --json jobs --jq '[.jobs[] | select(.name == "Build & Test" or .name == "Validate NormProof Architecture") | select(.conclusion == "success") | .name] | sort | join(",")')"
                if [[ "$jobs" != "Build & Test,Validate NormProof Architecture" ]]; then
                  echo "The main CI run for this release commit did not pass both required jobs."
                  exit 1
                fi
                echo "Both required main CI jobs passed for $GITHUB_SHA."
                exit 0
              fi
            fi
            echo "Waiting for the main CI run on $GITHUB_SHA (${attempt}/40)."
            sleep 15
          done
          echo "No successful main CI run completed for $GITHUB_SHA within 10 minutes."
          exit 1

  build:
    needs: verify-ci
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: cheers-linux-x64
            platform: linux-x64
          - os: macos-15
            asset: cheers-darwin-arm64
            platform: darwin-arm64
          - os: macos-15-intel
            asset: cheers-darwin-x64
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20.3.0'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          SHELL_TAG="v$(node -p "require('./packages/ts-shell/package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_TAG" ] || [ "$RELEASE_TAG" != "$SHELL_TAG" ]; then
            echo "Release tag must match both package versions ($PACKAGE_TAG and $SHELL_TAG)."
            exit 1
          fi
          if [ "$(node -p 'process.platform + "-" + process.arch')" != "$RELEASE_PLATFORM" ]; then
            echo "Runner does not match release platform $RELEASE_PLATFORM."
            exit 1
          fi

      - name: Install and build
        run: npm ci && npm run build && npm run build:exe -- --outfile "dist/bin/${{ matrix.asset }}"

      - name: Verify executable
        env:
          ASSET: ${{ matrix.asset }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          DIST="dist/bin/$ASSET"
          test "$("$DIST" --version)" = "${RELEASE_TAG#v}"
          "$DIST" --help >/dev/null
          (cd dist/bin && shasum -a 256 "$ASSET" > "$ASSET.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/bin/${{ matrix.asset }}
            dist/bin/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    needs: [verify-ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          pattern: cheers-*
          merge-multiple: true

      - name: Verify assets
        run: |
          cd dist/release
          for asset in cheers-linux-x64 cheers-darwin-arm64 cheers-darwin-x64; do
            test -s "$asset"
            test -s "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/cheers-* --verify-tag --generate-notes
