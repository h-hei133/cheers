[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-agents-eval"
version = "0.1.0"
description = "Python evaluation layer for offline research and analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-watch>=4.2",
    "mypy>=1.0",
    "pylint>=2.15",
    "black>=23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pylint]
max-line-length = 100
